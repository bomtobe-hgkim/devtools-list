name: Add a DevTool
description: Suggest a developer tool that is missing from the directory.
title: "Add: "
labels: []
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: What is the DevTool called?
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      description: Link to its canonical HTTPS homepage.
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: In one or two sentences, what does it help developers do?
    validations:
      required: true
